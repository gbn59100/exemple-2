# Configuration Netlify pour un site généré avec Cecil (PHP)
[build]
  # Télécharge Cecil puis construit le site
  command = "curl -sSOL https://cecil.app/build.sh && bash ./build.sh"
  # Dossier généré par Cecil
  publish = "_site"

# Si le build échoue à cause de la version de PHP, décommente (Cecil demande PHP 8.1+) :
# [build.environment]
#   PHP_VERSION = "8.2"
