backend:
  name: git-gateway
  branch: main

locale: fr
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: site
    label: "Mon site"
    files:
      - name: contenu
        label: "Contenu du site"
        file: "content/site.json"
        fields:
          # --- Accueil ---
          - { label: "Nom du restaurant", name: name, widget: string, required: false }
          - { label: "Slogan", name: tagline, widget: string, required: false }
          - { label: "Bandeau d'annonce (laisser vide pour le masquer)", name: announcement, widget: string, required: false }
          - { label: "Photo d'accueil (grande image)", name: hero_image, widget: image, required: false }
          - { label: "Lien de réservation en ligne (optionnel, sinon le bouton appelle le téléphone)", name: reservation_link, widget: string, required: false }
          # --- À propos ---
          - { label: "Titre « À propos »", name: about_title, widget: string, required: false }
          - { label: "Texte « À propos »", name: about_text, widget: text, required: false }
          - { label: "Photo « À propos »", name: about_image, widget: image, required: false }
          - label: "Points forts"
            name: highlights
            widget: list
            required: false
            summary: "{{fields.icon}} {{fields.title}}"
            fields:
              - { label: "Icône (un emoji)", name: icon, widget: string, required: false }
              - { label: "Titre", name: title, widget: string, required: false }
              - { label: "Texte", name: text, widget: string, required: false }
          # --- Carte ---
          - label: "Carte"
            name: menu
            widget: list
            required: false
            summary: "{{fields.category}}"
            fields:
              - { label: "Catégorie", name: category, widget: string, required: false }
              - label: "Plats"
                name: items
                widget: list
                required: false
                summary: "{{fields.name}} – {{fields.price}}"
                fields:
                  - { label: "Nom", name: name, widget: string, required: false }
                  - { label: "Description", name: description, widget: string, required: false }
                  - { label: "Prix", name: price, widget: string, required: false }
          # --- Galerie & avis ---
          - label: "Galerie photos"
            name: gallery
            widget: list
            required: false
            field: { label: "Photo", name: image, widget: image, required: false }
          - label: "Avis clients"
            name: reviews
            widget: list
            required: false
            summary: "{{fields.author}}"
            fields:
              - { label: "Prénom / nom", name: author, widget: string, required: false }
              - { label: "Avis", name: text, widget: text, required: false }
          # --- Contact ---
          - label: "Horaires"
            name: hours
            widget: list
            required: false
            summary: "{{fields.day}}"
            fields:
              - { label: "Jour(s)", name: day, widget: string, required: false }
              - { label: "Horaires", name: time, widget: string, required: false }
          - { label: "Adresse", name: address, widget: string, required: false }
          - { label: "Téléphone", name: phone, widget: string, required: false }
          - { label: "Email", name: email, widget: string, required: false }
          - { label: "Lien Instagram (https://...)", name: instagram, widget: string, required: false }
          - { label: "Lien Facebook (https://...)", name: facebook, widget: string, required: false }
